<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Monitoreo Pluvial - 16 Días</title>
    <style>
        :root {
            --primary: #2563eb;
            --dark: #1e293b;
            --light: #f8fafc;
            --accent: #0ea5e9;
        }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--light);
            color: var(--dark);
            margin: 0;
            display: flex;
            justify-content: center;
            padding: 20px;
        }
        .app-card {
            background: white;
            width: 100%;
            max-width: 500px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            padding: 24px;
            overflow: hidden;
        }
        header { text-align: center; margin-bottom: 24px; }
        header h1 { margin: 0; color: var(--primary); font-size: 1.6rem; }
        
        .location-box {
            background: #eff6ff;
            border-left: 4px solid var(--primary);
            padding: 12px;
            margin-bottom: 20px;
            border-radius: 4px;
            font-size: 0.9rem;
        }
        .coord-label { font-weight: bold; color: var(--primary); }

        button {
            background: var(--primary);
            color: white;
            border: none;
            width: 100%;
            padding: 16px;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 20px;
        }
        button:active { transform: scale(0.98); }
        button:disabled { background: #94a3b8; }

        .forecast-container {
            display: flex;
            gap: 12px;
            overflow-x: auto;
            padding-bottom: 15px;
            margin-top: 10px;
            scrollbar-width: thin;
        }
        .forecast-card {
            min-width: 110px;
            background: #fff;
            border: 1px solid #e2e8f0;
            padding: 12px;
            border-radius: 12px;
            text-align: center;
        }
        .day-name { font-weight: bold; font-size: 0.85rem; color: #64748b; text-transform: uppercase; }
        .temp { font-size: 1.1rem; font-weight: 700; margin: 8px 0; }
        .rain-prob { font-size: 0.8rem; color: var(--primary); font-weight: 600; }

        .footer-credit {
            margin-top: 25px;
            font-size: 0.75rem;
            color: #94a3b8;
            text-align: center;
            border-top: 1px solid #f1f5f9;
            padding-top: 15px;
        }
        #status { font-size: 0.9rem; text-align: center; margin-bottom: 10px; }
    </style>
</head>
<body>

<div class="app-card">
    <header>
        <h1>Pronóstico Avanzado</h1>
        <p style="color: #64748b; font-size: 0.9rem;">Análisis Meteorológico Multi-Día</p>
    </header>

    <div id="location-info" class="location-box" style="display: none;">
        <div><span class="coord-label">Poblado:</span> <span id="town">Buscando...</span></div>
        <div style="margin-top: 5px;">
            <span class="coord-label">Lat:</span> <span id="lat-val">0</span> | 
            <span class="coord-label">Lon:</span> <span id="lon-val">0</span>
        </div>
    </div>

    <div id="status">Presione el botón para iniciar</div>
    <button id="mainBtn">Obtener Diagnóstico</button>

    <div id="forecast-wrapper" style="display: none;">
        <h3 style="font-size: 1rem; margin-bottom: 10px;">Pronóstico de 16 Días:</h3>
        <div class="forecast-container" id="forecast-list"></div>
    </div>

    <div class="footer-credit">
        Desarrollado para: <strong>Jaime Ulises Paz López</strong><br>
        Especialista en Ingeniería y Acuicultura
    </div>
</div>

<script>
    const mainBtn = document.getElementById('mainBtn');
    const statusTxt = document.getElementById('status');
    const locationBox = document.getElementById('location-info');
    const forecastWrapper = document.getElementById('forecast-wrapper');
    const forecastList = document.getElementById('forecast-list');

    mainBtn.addEventListener('click', () => {
        statusTxt.innerText = "Localizando dispositivo...";
        mainBtn.disabled = true;
        
        if (!navigator.geolocation) {
            statusTxt.innerText = "Error: Geolocalización no soportada.";
            mainBtn.disabled = false;
            return;
        }

        navigator.geolocation.getCurrentPosition(async (pos) => {
            const lat = pos.coords.latitude;
            const lon = pos.coords.longitude;

            document.getElementById('lat-val').innerText = lat.toFixed(4);
            document.getElementById('lon-val').innerText = lon.toFixed(4);
            locationBox.style.display = 'block';

            // 1. Obtener Poblado (Reverse Geocoding)
            try {
                const geoRes = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}&zoom=10`);
                const geoData = await geoRes.json();
                const town = geoData.address.city || geoData.address.town || geoData.address.village || geoData.address.county || "Ubicación Desconocida";
                document.getElementById('town').innerText = town;
            } catch (e) {
                document.getElementById('town').innerText = "Error al obtener poblado";
            }

            // 2. Obtener Clima (16 días)
            statusTxt.innerText = "Consultando satélites meteorológicos...";
            try {
                const weatherRes = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=auto&forecast_days=16`);
                const weatherData = await weatherRes.json();
                renderForecast(weatherData.daily);
            } catch (e) {
                statusTxt.innerText = "Error al conectar con el servicio de clima.";
            } finally {
                mainBtn.disabled = false;
            }

        }, (err) => {
            statusTxt.innerText = "Error: Acceso a ubicación denegado.";
            mainBtn.disabled = false;
        });
    });

    function renderForecast(daily) {
        forecastList.innerHTML = '';
        statusTxt.innerText = "Diagnóstico completado.";
        forecastWrapper.style.display = 'block';

        const days = ['Dom', 'Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb'];

        daily.time.forEach((dateStr, i) => {
            const date = new Date(dateStr + "T00:00:00");
            const dayName = days[date.getDay()];
            const prob = daily.precipitation_probability_max[i];
            
            const card = document.createElement('div');
            card.className = 'forecast-card';
            // Resaltar si la probabilidad de lluvia es alta (>50%)
            if(prob > 50) card.style.borderColor = 'var(--primary)';

            card.innerHTML = `
                <div class="day-name">${dayName} ${date.getDate()}</div>
                <div class="temp">${Math.round(daily.temperature_2m_max[i])}° / ${Math.round(daily.temperature_2m_min[i])}°</div>
                <div class="rain-prob">💧 ${prob}%</div>
            `;
            forecastList.appendChild(card);
        });
    }
</script>

</body>
</html>
